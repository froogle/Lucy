# Lucy's binaries link only permissively licensed crates (ADR 0003).
# Copyleft code runs only out of process (Piper, Plugins).

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.9
# The list is the policy, not an inventory of what's used today.
unused-allowed-license = "allow"

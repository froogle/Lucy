[package]
name = "lucyd"
description = "Lucy's daemon: owns audio, the Session and every child process"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
lucy-ipc.workspace = true
lucy-config.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process"] }
toml.workspace = true
rmcp = { workspace = true, features = ["server", "client", "transport-child-process"] }
landlock = "0.4.7"
sha2 = "0.11.1"
cpal = { version = "0.18.2", features = ["pipewire", "pulseaudio"] }
hound = "3.5"
rubato = "5.1.0"
rtrb = "0.4.1"
ureq = { version = "3", default-features = false }
libc = "0.2"
ort.workspace = true
ort-tract.workspace = true
whisper-rs.workspace = true

[dev-dependencies]
tempfile.workspace = true
sha2 = "0.11.1"
rmcp = { workspace = true, features = ["client", "transport-child-process", "transport-io"] }
tokio = { workspace = true, features = ["process"] }

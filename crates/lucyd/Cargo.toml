[package]
name = "lucyd"
description = "Lucy's daemon: owns audio, the Session and every child process"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
lucy-ipc.workspace = true
lucy-config.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process"] }
toml.workspace = true
rmcp = { workspace = true, features = ["server", "client", "transport-child-process"] }
landlock = "0.4.7"
sha2 = "0.11.1"
cpal = { version = "0.18.2", features = ["pipewire", "pulseaudio"] }
hound = "3.5"
rubato = "5.1.0"
rtrb = "0.4.1"
# A pure-Rust port of WebRTC AEC3 (BSD-3-Clause); see audio/sonora.rs.
sonora = "0.3.0"
ureq = { version = "3", default-features = false }
libc = "0.2"
ort.workspace = true
ort-tract.workspace = true
whisper-rs.workspace = true
# v2 models need an unreleased livekit-wakeword; pinned until 0.2 is on crates.io.
livekit-wakeword = { git = "https://github.com/livekit/rust-sdks", rev = "1b19002692239946fa7c31ca59d320b95833819c" }
log = "0.4"
env_logger = { version = "0.11", default-features = false }
ignore = "0.4"
zbus = { version = "6", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile.workspace = true
sha2 = "0.11.1"
rmcp = { workspace = true, features = ["client", "transport-child-process", "transport-io"] }
tokio = { workspace = true, features = ["process"] }

[lints]
workspace = true

[package]
name = "lucyd"
description = "Lucy's daemon: owns audio, the Session and every child process"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
lucy-ipc.workspace = true
lucy-config.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rmcp = { workspace = true, features = ["server"] }
cpal = { version = "0.18.2", features = ["pipewire", "pulseaudio"] }
hound = "3.5"
rubato = "5.1.0"
rtrb = "0.4.1"
ureq = { version = "3", default-features = false }
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
tokio = { workspace = true, features = ["process"] }

[package]
name = "lucy-omarchy"
description = "The Omarchy Plugin: windows, workspaces, layouts and Omarchy's settings on the Omarchy desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
rmcp = { workspace = true, features = ["server", "transport-io"] }
tokio = { workspace = true, features = ["rt", "process"] }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true

[dev-dependencies]
rmcp = { workspace = true, features = ["client"] }
tempfile.workspace = true
toml.workspace = true

[lints]
workspace = true

name = "omarchy"
version = "0.1.0"
author = "human"
summary = "Manages windows, workspaces, layouts and Omarchy's own settings on the Omarchy desktop"
command = ["./lucy-omarchy"]
# Only on Omarchy: Hyprland running, with Omarchy's layout commands. Omarchy's
# commands find its themes and shell through OMARCHY_PATH, and its shell (which
# the bar, lock and theme commands reach) through WAYLAND_DISPLAY.
requires = { env = [
    "HYPRLAND_INSTANCE_SIGNATURE",
    "XDG_RUNTIME_DIR",
    "OMARCHY_PATH",
    "WAYLAND_DISPLAY",
], commands = [
    "omarchy-hyprland-workspace-layout-current",
    "omarchy-hyprland-workspace-layout-toggle",
] }

[[tools]]
name = "list_windows"
handles = "which windows are open and where"
examples = ["what windows have I got open?", "where's Firefox?"]

[[tools]]
name = "window"
handles = "focusing, closing, moving, full-screening, floating or pinning a window"
examples = ["move Firefox to workspace 3", "make this full screen", "close the terminal"]

[[tools]]
name = "kill_window"
handles = "force-quitting a window's app"
examples = ["force quit Slack", "kill that window"]
confirm = true
confirm_prompt = "Shall I force-quit that window ({target})? Anything unsaved in it will be lost."

[[tools]]
name = "workspace"
handles = "switching to or renaming a workspace"
examples = ["go to workspace 2", "call this workspace mail"]

[[tools]]
name = "layout"
handles = "changing a workspace's layout to tiling, scrolling or floating"
examples = ["switch to tiling", "make this workspace scrolling"]

[[tools]]
name = "theme"
handles = "listing Omarchy's themes or switching to one"
examples = ["switch to the Tokyo Night theme", "what themes have I got?"]

[[tools]]
name = "bar"
handles = "showing or hiding Omarchy's bar"
examples = ["hide the bar", "bring the bar back"]

[[tools]]
name = "night_light"
handles = "turning the night light on or off"
examples = ["turn on night light", "night light off"]

[[tools]]
name = "screenshot"
handles = "taking a screenshot of the screen, a region or a window"
examples = ["take a screenshot", "screenshot a window"]

[[tools]]
name = "screenshot_for_model"
handles = "looking at what's on the screen, or in one window, when a request needs it"
examples = ["what's on my screen?", "what does this error say?", "read me the open email"]
screen = "look"

[[tools]]
name = "click"
handles = "clicking something on the screen, after looking at it"
examples = ["play the third video", "click Sign in", "open the first result"]
screen = "click"

[[tools]]
name = "type"
handles = "typing text into the focused field, after looking at it"
examples = ["search for lofi beats", "type hello world"]
screen = "type"

[[tools]]
name = "key"
handles = "pressing a key or key combination, such as Enter, Escape or Ctrl+L"
examples = ["press Enter", "go back a page", "close this tab"]
screen = "key"

[[tools]]
name = "scroll"
handles = "scrolling on the screen, after looking at it"
examples = ["scroll down", "scroll up a bit"]
screen = "scroll"

# Lucy calls this herself before a click whose describe is plain, to check
# the text under it against [screen] risky_words, and to see whether a
# browser's accessibility is off; it is never offered to the model.
[[tools]]
name = "text_at"
handles = "reading the element under a point on the screen"
screen = "probe"

[[tools]]
name = "idle_lock"
handles = "locking the screen, or keeping the computer awake"
examples = ["lock the screen", "keep the computer awake"]

[access]
# omarchy-theme-set takes these locks in $XDG_RUNTIME_DIR, each only once it
# exists there (Omarchy makes it on the first theme change after login). The
# rest of $XDG_RUNTIME_DIR, Hyprland's and the Omarchy shell's sockets
# included, stays out: Landlock in v0.1 doesn't confine connecting to a socket.
# Omarchy's commands keep their state (layouts, themes, toggles) under
# ~/.local/state/omarchy and caches under ~/.cache/omarchy, and read their
# themes and language from ~/.config/omarchy. The lock looks for running apps
# through /proc. The screenshot and the night light's toggle start through
# Hyprland's exec, outside this sandbox (ADR 0012), so they're listed in
# commands but need no access here. Looks capture the screen over the
# Wayland socket into a memfd, never a file in /dev/shm. Clicks, keys,
# scrolling and typing go over the same socket through Wayland's virtual
# pointer and keyboard, with the keymap in a memfd. The text_at probe reads
# apps' accessibility trees over the AT-SPI bus, a socket under
# $XDG_RUNTIME_DIR/at-spi found through the session bus's socket there.
write = [
    "$XDG_RUNTIME_DIR/omarchy-theme-set.lock",
    "$XDG_RUNTIME_DIR/omarchy-theme-set-retint.lock",
    "$XDG_RUNTIME_DIR/omarchy-theme-set-herdr-machines.lock",
    "~/.local/state/omarchy",
    "~/.cache/omarchy",
]
read = ["~/.config/omarchy", "/proc"]
commands = [
    "omarchy-capture-screenshot",
    "omarchy-hyprland-workspace-layout-current",
    "omarchy-hyprland-workspace-layout-toggle",
    "omarchy-system-lock",
    "omarchy-theme-current",
    "omarchy-theme-list",
    "omarchy-theme-set",
    "omarchy-toggle-bar",
    "omarchy-toggle-idle",
    "omarchy-toggle-nightlight",
]

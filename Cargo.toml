[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.100"

[workspace.dependencies]
lucy-ipc = { path = "crates/lucy-ipc" }
lucy-config = { path = "crates/lucy-config" }
lucyd = { path = "crates/lucyd" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
toml = "0.9"
toml_edit = "0.25"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "signal", "time"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
rmcp = { version = "3.10", default-features = false }
# ort-tract pins ort-sys exactly, so the two move together. The next pair
# (ort 2.0.0-rc.14 + ort-tract 0.5.0) fails to compile with these features.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "alternative-backend", "api-17"] }
ort-tract = "=0.3.0"
whisper-rs = { version = "0.16", features = ["vulkan"] }

# Approvals hash Plugin executables, and unoptimised SHA-256 makes every
# test Session with a debug-built fixture Plugin take a second longer.
[profile.dev.package.sha2]
opt-level = 3

# tract runs the VAD; unoptimised it is far slower than real time.
[profile.dev.package."tract-core"]
opt-level = 3

[profile.dev.package."tract-linalg"]
opt-level = 3

[profile.dev.package."tract-onnx"]
opt-level = 3

[profile.dev.package."tract-hir"]
opt-level = 3

[profile.dev.package."tract-data"]
opt-level = 3

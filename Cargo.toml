[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.100"

[workspace.dependencies]
lucy-ipc = { path = "crates/lucy-ipc" }
lucy-config = { path = "crates/lucy-config" }
lucyd = { path = "crates/lucyd" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
toml = "0.9"
toml_edit = "0.25"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "signal", "time"] }
clap = { version = "4", features = ["derive"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
tempfile = "3"
base64 = "0.23"
rmcp = { version = "3.10", default-features = false }
# ort-tract pins ort-sys exactly, so the two move together, and
# livekit-wakeword (the wake word) needs this pair. The next pair
# (ort 2.0.0-rc.14 + ort-tract 0.5.0) fails to compile with these features.
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["std", "alternative-backend"] }
ort-tract = "=0.2.0"
whisper-rs = { version = "0.16", features = ["vulkan"] }

# Full debug info made each of the ~60 test binaries over 500 MB, and a cold
# `target/` 37 GB. Line tables for Lucy's own crates keep file:line in panic
# backtraces; dependencies get none. A cold `target/` is then about 9 GB.
# For a debugger session, set `debug = true` in both sections locally.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Approvals hash Plugin executables, and unoptimised SHA-256 makes every
# test Session with a debug-built fixture Plugin take a second longer.
[profile.dev.package.sha2]
opt-level = 3

# tract runs the VAD; unoptimised it is far slower than real time.
[profile.dev.package."tract-core"]
opt-level = 3

[profile.dev.package."tract-linalg"]
opt-level = 3

[profile.dev.package."tract-onnx"]
opt-level = 3

[profile.dev.package."tract-hir"]
opt-level = 3

[profile.dev.package."tract-data"]
opt-level = 3

[workspace.lints.clippy]
unwrap_used = "deny"

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
lucy-ipc = { path = "crates/lucy-ipc" }
lucy-config = { path = "crates/lucy-config" }
lucyd = { path = "crates/lucyd" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "signal", "time"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
rmcp = { version = "3.10", default-features = false }
rtrb = "0.3"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "alternative-backend", "api-17"] }
ort-tract = "=0.3.0"
hound = "3"
whisper-rs = { version = "0.16", features = ["vulkan"] }

# tract runs the VAD; unoptimised it is far slower than real time.
[profile.dev.package."tract-core"]
opt-level = 3

[profile.dev.package."tract-linalg"]
opt-level = 3

[profile.dev.package."tract-onnx"]
opt-level = 3

[profile.dev.package."tract-hir"]
opt-level = 3

[profile.dev.package."tract-data"]
opt-level = 3
